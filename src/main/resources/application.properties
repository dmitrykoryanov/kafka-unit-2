spring.application.name=kafka-unit-2

# Адрес брокера для запуска с хоста. В Docker переопределяется переменной окружения KAFKA_BOOTSTRAP_SERVERS.
kafka.bootstrap-servers=localhost:9092
# application.id Kafka Streams. Если его сменить, приложение заново обработает все топики с начала.
kafka.application-id=message-filter-app
# Каталог для файлов persistent state store (RocksDB), относительно рабочего каталога. Временный каталог ОС
# не годится: ОС может его очистить. В Docker – переменная KAFKA_STATE_DIR.
kafka.state-dir=build/kafka-streams-state

# Отправлять ли при старте тестовые данные (TestDataProducer). В Docker – переменная APP_TEST_DATA_ENABLED.
app.test-data.enabled=true
